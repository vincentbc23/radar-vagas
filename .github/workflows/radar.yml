name: Radar de Vagas

on:
  schedule:
    # 3x por dia: ~07:47, 13:47 e 19:47 (horário de Brasília = UTC-3)
    - cron: "47 10,16,22 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write         # para salvar data/seen.json de volta no repositório

concurrency:
  group: radar-vagas
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar vagas e notificar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vagas.py

      - name: Salvar histórico de vagas vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "radar: atualiza vagas vistas"
            git push
          fi
